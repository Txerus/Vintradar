services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vintradar}
      POSTGRES_USER: ${POSTGRES_USER:-vintradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-vintradar}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes:
      - ./backend/tests/fixtures/vinted:/app/tests/fixtures/vinted
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  migrate:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && python scripts/rescore_all.py --pending"
    depends_on:
      postgres: {condition: service_healthy}
  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    ports: ["8080:80"]
    volumes: [ntfy_data:/var/cache/ntfy]
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8080}
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes: [ollama_data:/root/.ollama]
volumes:
  postgres_data:
  ntfy_data:
  ollama_data:
