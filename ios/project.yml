name: VintRadar
options:
  bundleIdPrefix: com.txerus
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.txerus.vintradar
    INFOPLIST_KEY_CFBundleDisplayName: VintRadar
    INFOPLIST_KEY_CFBundleURLTypes: '[{"CFBundleURLSchemes":["vintradar"]}]'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: '["com.txerus.vintradar.refresh"]'
targets:
  VintRadar:
    type: application
    platform: iOS
    sources: [VintRadar]
    resources:
      - VintRadar/Assets.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [VintRadarTests]
  VintRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VintRadarTests]
    dependencies:
      - target: VintRadar
