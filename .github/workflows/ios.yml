name: iOS IPA
on:
  push:
  workflow_dispatch:
jobs:
  ios:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Swift tests
        working-directory: ios
        run: xcodebuild test -project VintRadar.xcodeproj -scheme VintRadar -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned app
        working-directory: ios
        run: xcodebuild build -project VintRadar.xcodeproj -scheme VintRadar -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        working-directory: ios
        run: mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/VintRadar.app Payload/ && zip -qry VintRadar-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: {name: VintRadar-unsigned, path: ios/VintRadar-unsigned.ipa}
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: {files: ios/VintRadar-unsigned.ipa}
