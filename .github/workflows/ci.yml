name: CI
on: [push, workflow_dispatch]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vintradar_test
          POSTGRES_USER: vintradar
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vintradar -d vintradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://vintradar:test-password@localhost:5432/vintradar_test
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[test]'
      - name: Migrate legacy schema and seed duplicate listings
        run: |
          alembic upgrade 0003
          python scripts/check_duplicate_migration.py seed
      - name: Run v0.2 migration and verify duplicate merge
        run: |
          alembic upgrade head
          python scripts/check_duplicate_migration.py verify
      - name: Verify PostgreSQL schema
        run: python scripts/check_schema.py
      - name: Check migration/model parity
        run: alembic check
      - name: Run backend tests
        run: pytest -q
      - name: Run real ntfy integration test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ntfy-ci -p 8081:80 binwiederhier/ntfy:latest serve
          trap 'docker logs ntfy-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/v1/health
          NTFY_URL=http://127.0.0.1:8081 \
          NTFY_TOPIC="vintradar-ci-${GITHUB_RUN_ID}" \
          NTFY_INTEGRATION=1 \
          pytest -q tests/integration/test_ntfy_container.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t vintradar:test backend
      - run: docker run --rm vintradar:test python -c "import app; print('PYTHONPATH import verified')"
